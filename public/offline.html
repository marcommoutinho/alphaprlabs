<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f2f2ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0d0f" media="(prefers-color-scheme: dark)" />
    <title>Offline · Alpha PR Labs</title>
    <!--
      The research app's offline launch page (design v3). The service worker
      (sw.js) precaches this page, and serves it only when opening an app page
      finds no network. Self-contained (the app icon is inline): no app data,
      no other requests. Try again reloads.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --paper: #f2f2ee;
        --surface: #ffffff;
        --line: #dcdcd5;
        --ink: #0d0e10;
        --ink-2: #464950;
        --ink-3: #676b73;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #0c0d0f;
          --surface: #16181b;
          --line: #2a2d32;
          --ink: #f3f3f0;
          --ink-2: #b4b7be;
          --ink-3: #8c9098;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--paper);
        color: var(--ink);
        font-family: Geist, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        display: flex;
        min-height: 100dvh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        border: 1px solid var(--line);
      }
      .glyph {
        display: flex;
        width: 44px;
        height: 44px;
        margin-top: 28px;
        align-items: center;
        justify-content: center;
        border-radius: 14px;
        background: var(--surface);
        border: 1px solid var(--line);
        color: var(--ink-2);
      }
      h1 {
        margin: 16px 0 0;
        font-size: 28px;
        line-height: 1.15;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
      p {
        margin: 8px 0 0;
        max-width: 320px;
        font-size: 16px;
        line-height: 1.45;
        color: var(--ink-2);
      }
      button {
        margin-top: 28px;
        width: 100%;
        max-width: 320px;
        height: 56px;
        border: 0;
        border-radius: 16px;
        background: var(--ink);
        color: var(--paper);
        font: inherit;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.01em;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #60a5fa;
        outline-offset: 3px;
      }
      .brand {
        margin-top: 28px;
        font-size: 13px;
        color: var(--ink-3);
      }
    </style>
  </head>
